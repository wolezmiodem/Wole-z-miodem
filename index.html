<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wolę z Miodem</title>
    <!-- Biblioteka Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff9e6 0%, #ffecb3 100%);
            color: #4a3b32;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            margin-top: 40px;
        }

        h1 {
            font-size: 2.8rem;
            color: #d97706;
            margin-bottom: 20px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        p.intro {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            color: #614835;
        }

        .counter-box {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 2px solid #f59e0b;
            border-radius: 15px;
            padding: 25px;
            margin: 30px auto;
            max-width: 350px;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.2);
        }

        .counter-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #92400e;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .counter-value {
            font-size: 3.5rem;
            font-weight: 800;
            color: #b45309;
            margin: 10px 0;
            transition: transform 0.1s ease;
        }

        .click-btn {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 15px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
            outline: none;
            user-select: none;
        }

        .click-btn:hover {
            background: #d97706;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(245, 158, 11, 0.5);
        }

        .click-btn:active {
            transform: translateY(1px);
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
        }

        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #88684d;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Wolę z Miodem 🍯</h1>
        <p class="intro">Witaj na naszej stronie! Kliknij poniższy przycisk, aby wesprzeć nasz licznik wspólnych kliknięć. Każde kliknięcie zapisuje się na żywo dla wszystkich użytkowników!</p>

        <div class="counter-box">
            <div class="counter-title">Liczba kliknięć</div>
            <div id="licznik" class="counter-value">...</div>
            <button class="click-btn" id="clickBtn" onclick="zwiekszLicznik()">Kliknij mnie! 🐝</button>
        </div>
    </div>

    <footer>
        &copy; Wolę z Miodem - Wszystkie prawa zastrzeżone.
    </footer>

    <script>
        // Dane dostępowe Supabase
        const SUPABASE_URL = 'https://igbhqfwnsnymvnsmycvu.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnYmhxZnduc255bXZuc215Y3Z1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTc0OTUsImV4cCI6MjEwODI3MzQ5NX0.ydKm6iIt7OXUJ9wkKRKKtWJGD48WelbseZ6p10xYSFQ';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ID wiersza w tabeli Licznik / licznik
        const ROW_ID = 1;

        // Funkcja pomocnicza określająca właściwą nazwę tabeli
        async function pobierzLicznik() {
            // Najpierw próbujemy z dużej litery 'Licznik', jeśli nie przejdzie, próbujemy 'licznik'
            let { data, error } = await _supabase
                .from('Licznik')
                .select('clicks')
                .eq('id', ROW_ID)
                .maybeSingle();

            if (error || !data) {
                const res = await _supabase
                    .from('licznik')
                    .select('clicks')
                    .eq('id', ROW_ID)
                    .maybeSingle();
                data = res.data;
            }

            if (data) {
                document.getElementById('licznik').innerText = data.clicks;
            } else {
                document.getElementById('licznik').innerText = 0;
            }
        }

        async function zwiekszLicznik() {
            const btn = document.getElementById('clickBtn');
            btn.disabled = true;

            // Sprawdzamy, która tabela istnieje ('Licznik' czy 'licznik')
            let tableName = 'Licznik';
            let { data, error } = await _supabase
                .from(tableName)
                .select('clicks')
                .eq('id', ROW_ID)
                .maybeSingle();

            if (error || !data) {
                tableName = 'licznik';
                const res = await _supabase
                    .from(tableName)
                    .select('clicks')
                    .eq('id', ROW_ID)
                    .maybeSingle();
                data = res.data;
            }

            const obecneClicks = data ? (data.clicks || 0) : 0;
            const nowaWartosc = obecneClicks + 1;

            const { error: updateError } = await _supabase
                .from(tableName)
                .update({ clicks: nowaWartosc })
                .eq('id', ROW_ID);

            if (!updateError) {
                document.getElementById('licznik').innerText = nowaWartosc;
            } else {
                console.error('Błąd zapisu:', updateError);
            }

            btn.disabled = false;
        }

        // Subskrypcja na żywo (Realtime) - aby licznik aktualizował się od razu u każdego!
        function wlaczenieRealtime() {
            _supabase
                .channel('public:licznik')
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'Licznik' }, payload => {
                    if (payload.new && payload.new.clicks !== undefined) {
                        document.getElementById('licznik').innerText = payload.new.clicks;
                    }
                })
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'licznik' }, payload => {
                    if (payload.new && payload.new.clicks !== undefined) {
                        document.getElementById('licznik').innerText = payload.new.clicks;
                    }
                })
                .subscribe();
        }

        // Inicjalizacja po załadowaniu strony
        pobierzLicznik();
        wlaczenieRealtime();
    </script>
</body>
</html>
